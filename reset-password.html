<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepuGuard — Nouveau mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
[data-theme="dark"]{--bg:#080910;--card:#151820;--border:rgba(255,255,255,0.07);--accent:#e8ff47;--text:#eef0f8;--muted:#8890a8;--red:#ff5252;--btn-text:#080910;}
[data-theme="light"]{--bg:#f5f6fa;--card:#ffffff;--border:rgba(0,0,0,0.08);--accent:#1a56e8;--text:#0f1117;--muted:#6b7280;--red:#dc2626;--btn-text:#ffffff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;transition:background .3s,color .3s;}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;color:var(--text);text-decoration:none;display:block;margin-bottom:2rem;}
.logo span{color:var(--accent);}
h1{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem;}
.subtitle{font-size:.85rem;color:var(--muted);margin-bottom:2rem;}
.form-group{margin-bottom:1.2rem;}
label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:.4rem;}
input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:.75rem 1rem;font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--accent);}
.btn{width:100%;background:var(--accent);color:var(--btn-text);border:none;border-radius:8px;padding:.9rem;font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;transition:opacity .2s;margin-top:.5rem;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.error{background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.25);color:var(--red);padding:.7rem 1rem;border-radius:8px;font-size:.82rem;margin-bottom:1rem;display:none;}
.error.show{display:block;}
.success{background:rgba(82,255,170,.08);border:1px solid rgba(82,255,170,.2);color:#52ffaa;padding:.8rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1rem;display:none;}
.success.show{display:block;}
.spinner{width:18px;height:18px;border:2px solid rgba(0,0,0,.3);border-top-color:var(--btn-text);border-radius:50%;animation:spin .7s linear infinite;display:none;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.links{text-align:center;margin-top:1.5rem;font-size:.82rem;color:var(--muted);}
.links a{color:var(--accent);text-decoration:none;}
.invalid-state{text-align:center;padding:1rem 0;}
.invalid-state p{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem;}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo">Repu<span>Guard</span></a>

  <div id="invalidState" class="invalid-state" style="display:none;">
    <h1>Lien invalide</h1>
    <p>Ce lien de réinitialisation est invalide ou a expiré.<br>Demandez un nouveau lien depuis la page de connexion.</p>
    <a href="/login" class="btn" style="display:inline-block;text-decoration:none;text-align:center;">← Retour à la connexion</a>
  </div>

  <div id="resetForm">
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle">Choisissez un mot de passe sécurisé pour votre compte.</p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" minlength="8">
    </div>
    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <input type="password" id="passwordConfirm" placeholder="••••••••" autocomplete="new-password">
    </div>

    <button class="btn" id="resetBtn" onclick="handleReset()">
      <span id="btnText">Enregistrer le mot de passe</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="links">
      <a href="/login">← Retour à la connexion</a>
    </div>
  </div>
</div>

<script>
(function(){
  var saved=localStorage.getItem('rg-theme');
  var systemDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', saved||(systemDark?'dark':'light'));
})();

// Extract access_token from URL hash (Supabase appends #access_token=...&type=recovery)
var hashParams = {};
window.location.hash.slice(1).split('&').forEach(function(p){
  var kv = p.split('=');
  if (kv.length === 2) hashParams[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]);
});

var accessToken = hashParams['access_token'];
var tokenType   = hashParams['type'];

if (!accessToken || tokenType !== 'recovery') {
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('invalidState').style.display = 'block';
}

async function handleReset() {
  var password        = document.getElementById('password').value;
  var passwordConfirm = document.getElementById('passwordConfirm').value;
  var errorDiv        = document.getElementById('errorMsg');
  var successDiv      = document.getElementById('successMsg');
  var btn             = document.getElementById('resetBtn');
  var btnText         = document.getElementById('btnText');
  var spinner         = document.getElementById('spinner');

  errorDiv.classList.remove('show');
  successDiv.classList.remove('show');

  if (!password || !passwordConfirm) {
    errorDiv.textContent = 'Veuillez remplir les deux champs.';
    errorDiv.classList.add('show');
    return;
  }
  if (password.length < 8) {
    errorDiv.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
    errorDiv.classList.add('show');
    return;
  }
  if (password !== passwordConfirm) {
    errorDiv.textContent = 'Les mots de passe ne correspondent pas.';
    errorDiv.classList.add('show');
    return;
  }

  btn.disabled = true;
  btnText.style.display = 'none';
  spinner.style.display = 'block';

  try {
    var res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'reset_password', accessToken: accessToken, password: password }),
    });

    var data = await res.json();

    if (data.error || !res.ok) {
      errorDiv.textContent = data.error?.message || 'Erreur lors de la mise à jour.';
      errorDiv.classList.add('show');
      btn.disabled = false;
      btnText.style.display = 'block';
      spinner.style.display = 'none';
      return;
    }

    successDiv.textContent = 'Mot de passe mis à jour ! Redirection en cours…';
    successDiv.classList.add('show');
    btn.disabled = true;

    // Clear hash to prevent reuse, redirect to login
    history.replaceState(null, '', window.location.pathname);
    setTimeout(function(){ window.location.href = '/login'; }, 2000);

  } catch(err) {
    errorDiv.textContent = 'Erreur réseau. Réessayez.';
    errorDiv.classList.add('show');
    btn.disabled = false;
    btnText.style.display = 'block';
    spinner.style.display = 'none';
  }
}

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter') handleReset();
});
</script>
</body>
</html>
