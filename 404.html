<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable — RepuGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--text:#f0f0f0;--muted:#666;--muted2:#999;--border:#1e1e1e;--accent:#e8ff47;--btn-text:#0a0a0a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none;position:fixed;top:1.5rem;left:5%;}
.logo span{color:var(--accent);}
.code{font-family:'Syne',sans-serif;font-size:7rem;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent);margin-bottom:1rem;}
h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:.75rem;}
p{color:var(--muted2);font-size:1rem;margin-bottom:2.5rem;max-width:380px;}
.btn{display:inline-block;background:var(--accent);color:var(--btn-text);padding:.85rem 2rem;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;text-decoration:none;transition:opacity .2s;}
.btn:hover{opacity:.85;}
.links{margin-top:1.5rem;display:flex;gap:1.5rem;justify-content:center;}
.links a{color:var(--muted2);font-size:.85rem;text-decoration:none;transition:color .2s;}
.links a:hover{color:var(--text);}
</style>
</head>
<body>
<a href="/" class="logo">Repu<span>Guard</span></a>
<div class="code">404</div>
<h1>Page introuvable</h1>
<p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
<a href="/" class="btn">Retour à l'accueil →</a>
<div class="links">
  <a href="/login">Connexion</a>
  <a href="/signup">S'inscrire</a>
  <a href="mailto:contact@repuguard.app">Contact</a>
</div>
</body>
</html>
