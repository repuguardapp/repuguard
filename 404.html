<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable — RepuGuard</title>
<script>(function(){var s=localStorage.getItem('rg-theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',s||(d?'dark':'light'));})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#07080f;--text:#f1f5f9;--muted:#94a3b8;--muted2:#475569;--border:rgba(255,255,255,0.06);--accent:#6366f1;--accent2:#818cf8;--surface:rgba(99,102,241,0.06);}
[data-theme="light"]{--bg:#f5f6fa;--text:#0f1117;--muted:#4b5563;--muted2:#6b7280;--border:rgba(0,0,0,0.08);--accent:#6366f1;--accent2:#4f46e5;--surface:rgba(99,102,241,0.06);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;transition:background .3s,color .3s;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none;position:fixed;top:1.5rem;left:5%;}
.logo span{color:var(--accent2);}
.theme-btn{position:fixed;top:1.4rem;right:5%;background:var(--surface);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:.4rem .8rem;font-size:.8rem;cursor:pointer;transition:all .2s;}
.theme-btn:hover{color:var(--text);}
.code{font-family:'Syne',sans-serif;font-size:7rem;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent2);margin-bottom:1rem;opacity:.9;}
h1{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:.75rem;letter-spacing:-.02em;}
p{color:var(--muted);font-size:1rem;margin-bottom:2.5rem;max-width:380px;line-height:1.6;}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:.85rem 2rem;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:.95rem;text-decoration:none;transition:all .2s;}
.btn:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(99,102,241,.25);}
.links{margin-top:1.5rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;}
.links a{color:var(--muted2);font-size:.85rem;text-decoration:none;transition:color .2s;}
.links a:hover{color:var(--accent2);}
</style>
</head>
<body>
<a href="/" class="logo">Repu<span>Guard</span></a>
<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀</button>
<div class="code">404</div>
<h1>Page introuvable</h1>
<p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
<a href="/" class="btn">Retour à l'accueil →</a>
<div class="links">
  <a href="/login">Connexion</a>
  <a href="/signup">S'inscrire</a>
  <a href="/contact">Contact</a>
</div>
<script>
function toggleTheme(){
  var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('rg-theme',t);
  document.getElementById('themeBtn').textContent=t==='dark'?'☀':'🌙';
}
(function(){
  var t=document.documentElement.getAttribute('data-theme');
  document.getElementById('themeBtn').textContent=t==='dark'?'☀':'🌙';
})();
</script>
</body>
</html>
