<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
<script>(function(){var s=localStorage.getItem("rg-theme");var d=window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",s||(d?"dark":"light"));})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — RepuGuard</title>
  <meta name="description" content="Contactez l'équipe RepuGuard pour toute question sur notre solution de gestion de réputation.">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root,[data-theme="dark"]{
      --bg:#07080f;--surface:#0e1018;--border:rgba(255,255,255,0.06);
      --text:#f1f5f9;--muted:#94a3b8;--muted2:#475569;
      --accent:#6366f1;--accent-hover:#4f51d8;--card:#13151f;
    }
    [data-theme="light"]{
      --bg:#f8fafc;--surface:#ffffff;--border:rgba(0,0,0,0.08);
      --text:#0f172a;--muted:#64748b;--muted2:#94a3b8;
      --accent:#4f46e5;--accent-hover:#3730a3;--card:#f1f5f9;
    }
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s;}
    a{color:inherit;text-decoration:none;}

    nav{padding:1rem 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
    .nav-logo{font-weight:900;font-size:1.2rem;letter-spacing:-0.5px;}
    .nav-logo span{color:#818cf8;}
    .nav-right{display:flex;align-items:center;gap:.75rem;}
    .nav-cta{background:var(--accent);color:white;padding:.5rem 1.2rem;border-radius:6px;font-size:.85rem;font-weight:600;transition:background .2s;}
    .nav-cta:hover{background:var(--accent-hover);}
    .theme-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted2);padding:.4rem .65rem;cursor:pointer;font-size:.95rem;transition:border-color .2s;}
    .theme-btn:hover{border-color:var(--muted2);}

    main{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 1.5rem;}
    .contact-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:520px;}
    .contact-card h1{font-size:1.6rem;font-weight:800;margin-bottom:.5rem;}
    .contact-card p{font-size:.9rem;color:var(--muted);margin-bottom:2rem;line-height:1.6;}

    label{display:block;font-size:.8rem;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;}
    input,textarea,select{
      width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:.9rem;padding:.7rem 1rem;margin-bottom:1.25rem;
      outline:none;transition:border-color .2s;font-family:inherit;
    }
    input:focus,textarea:focus,select:focus{border-color:var(--accent);}
    textarea{resize:vertical;min-height:120px;}
    input::placeholder,textarea::placeholder{color:var(--muted2);}
    select option{background:var(--surface);}

    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
    @media(max-width:480px){.form-row{grid-template-columns:1fr;}}

    .btn{width:100%;background:var(--accent);color:white;border:none;padding:.85rem;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;}
    .btn:hover:not(:disabled){background:var(--accent-hover);}
    .btn:disabled{opacity:.6;cursor:not-allowed;}

    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(1rem);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1.5rem;font-size:.85rem;font-weight:600;pointer-events:none;opacity:0;transition:all .3s;white-space:nowrap;z-index:999;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.green{border-color:rgba(52,211,153,.3);color:#34d399;}
    .toast.red{border-color:rgba(248,113,113,.3);color:#f87171;}

    footer{padding:1.5rem 5%;text-align:center;border-top:1px solid var(--border);font-size:.78rem;color:var(--muted2);}
    footer a{color:var(--muted2);}
    footer a:hover{color:var(--text);}
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Repu<span>Guard</span></a>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
    <a href="/signup" class="nav-cta" data-t="nav_cta">Essai gratuit →</a>
  </div>
</nav>

<main>
  <div class="contact-card">
    <h1 data-t="contact_h1">Contactez-nous</h1>
    <p data-t="contact_sub">Une question sur RepuGuard, besoin d'aide ou d'informations ? Nous répondons sous 24h.</p>

    <form id="contactForm" onsubmit="submitForm(event)">
      <div class="form-row">
        <div>
          <label data-t="contact_name_label">NOM</label>
          <input id="name" type="text" data-t-ph="contact_name_ph" placeholder="Jean Dupont" required>
        </div>
        <div>
          <label data-t="contact_email_label">EMAIL</label>
          <input id="email" type="email" data-t-ph="contact_email_ph" placeholder="vous@exemple.com" required>
        </div>
      </div>

      <label data-t="contact_subject_label">SUJET</label>
      <select id="subject">
        <option value="" data-t="contact_subject_opt0">Choisir un sujet…</option>
        <option value="Demande d'information" data-t="contact_subject_opt1">Demande d'information</option>
        <option value="Problème technique" data-t="contact_subject_opt2">Problème technique</option>
        <option value="Facturation" data-t="contact_subject_opt3">Facturation</option>
        <option value="Partenariat" data-t="contact_subject_opt4">Partenariat</option>
        <option value="Autre" data-t="contact_subject_opt5">Autre</option>
      </select>

      <label data-t="contact_msg_label">MESSAGE</label>
      <textarea id="message" data-t-ph="contact_msg_ph" placeholder="Décrivez votre demande…" required></textarea>

      <button type="submit" class="btn" id="submitBtn" data-t="contact_send">Envoyer le message</button>
    </form>
  </div>
</main>

<footer>© 2026 RepuGuard · <a href="/privacy" data-t="footer_privacy">Confidentialité</a> · <a href="/terms" data-t="footer_terms">Conditions</a></footer>

function getLang() {
  var l = localStorage.getItem('rg-lang') || 'fr';
  return CONTACT_TRANS[l] ? l : 'fr';
}

function applyTrans() {
  var lang = getLang();
  var t = CONTACT_TRANS[lang] || CONTACT_TRANS['fr'];
  var dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', dir);
  document.querySelectorAll('[data-t]').forEach(function(el) {
    var k = el.getAttribute('data-t');
    if (t[k] !== undefined) el.textContent = t[k];
  });
  document.querySelectorAll('[data-t-ph]').forEach(function(el) {
    var k = el.getAttribute('data-t-ph');
    if (t[k] !== undefined) el.placeholder = t[k];
  });
  // Translate select options value to match language
  var sel = document.getElementById('subject');
  var opts = sel.querySelectorAll('option[data-t]');
  opts.forEach(function(opt) {
    var k = opt.getAttribute('data-t');
    if (t[k]) { opt.textContent = t[k]; opt.value = k !== 'contact_subject_opt0' ? t[k] : ''; }
  });
}

function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('rg-theme', isDark ? 'light' : 'dark');
}

function initTheme() {
  var saved = localStorage.getItem('rg-theme');
  var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(function() { t.className = 'toast'; }, 3500);
}

async function submitForm(e) {
  e.preventDefault();
  var lang = getLang();
  var t = CONTACT_TRANS[lang] || CONTACT_TRANS['fr'];
  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '…';

  var body = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    subject: document.getElementById('subject').value,
    message: document.getElementById('message').value.trim(),
  };

  try {
    var res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur');
    showToast(t.contact_success, 'green');
    document.getElementById('contactForm').reset();
  } catch (err) {
    showToast(err.message || t.contact_error, 'red');
  } finally {
    btn.disabled = false;
    btn.textContent = t.contact_send;
  }
}

initTheme();
applyTrans();
</script>

</html>
