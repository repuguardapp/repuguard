name: CI

on:
  push:
    branches: [main, lexy/genesis]
  pull_request:
    branches: [main, lexy/genesis]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    # Pinned, not `ubuntu-latest`. GitHub moved that label to Ubuntu
    # 26.04 on 20 October and Playwright 1.59.1 cannot install a browser
    # there, which silently stopped the e2e job below from running at
    # all. Pinning both jobs to the same image also keeps the `.next`
    # artifact this one uploads and the e2e job downloads built and run
    # on one OS rather than two.
    #
    # This is a dated decision, not a permanent one: 24.04 will be
    # retired in its turn. The point is that the version moves when we
    # change it, rather than under us on a Tuesday morning.
    runs-on: ubuntu-24.04
    # Install, typecheck, 981 unit tests, a full Next build and an
    # artifact upload. Ten minutes was already tight and the job was
    # killed at it once the artifact started carrying a real build.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://lexyflow.com
          NEXT_PUBLIC_APP_NAME: LexyFlow

      - name: Upload .next build for E2E
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          # Without this the whole job is theatre.
          #
          # upload-artifact@v4 excludes hidden paths by default, and
          # `.next` is one. The upload succeeded, the download
          # succeeded, and the directory simply was not there — so
          # Playwright started `next start` against nothing and failed
          # with "Could not find a production build in the '.next'
          # directory". The artifact measured 714 KB; a production build
          # is tens of megabytes, which is how this was confirmed rather
          # than guessed.
          #
          # And then it carried too much: `.next/cache` is 691 MB of the
          # 798 MB tree and `next start` never reads it. Including it
          # turned a fast upload into the thing that pushed this job past
          # its own timeout.
          include-hidden-files: true
          path: |
            .next
            !.next/cache
            public
            messages
            package.json
            package-lock.json
            next.config.mjs
            playwright.config.ts
            e2e
            tsconfig.json
            src
            tailwind.config.ts
            postcss.config.mjs
          retention-days: 1

  e2e:
    name: Playwright · critical user flows
    needs: build
    # See the note on the build job. On `ubuntu-latest` the browser
    # install failed and the suite step was marked SKIPPED — neither
    # pass nor fail, which is the one outcome nobody reads.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_APP_NAME: LexyFlow
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-not-real

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
